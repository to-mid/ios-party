name: MIX2 experimental driver phone images

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Source experiment to package
        type: choice
        required: true
        default: smp
        options: [smp, touch-probe, touch-clock-probe, touch-pinmux-probe, touch-reset-probe, touch-l6-probe, touch-l6-trace, touch-l6-abi, touch-l6-capture, touch-active, touch-desktop, touch-capture, touch-hid-replay, touch-capture-wake, touch-input-qos, touch-smp2-qos, touch-smp4-qos, touch-smp8-qos]
      touch_source_run:
        description: Successful touch source build run for touch-probe
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  image:
    name: Experimental ${{ startsWith(inputs.variant, 'touch-smp') && format('TOUCH-SMP{0}-QOS', matrix.cpu_count) || inputs.variant == 'touch-input-qos' && 'TOUCH-INPUT-QOS' || inputs.variant == 'touch-capture-wake' && 'TOUCH-CAPTURE-WAKE' || inputs.variant == 'touch-hid-replay' && 'TOUCH-HID-REPLAY' || inputs.variant == 'touch-capture' && 'TOUCH-CAPTURE' || inputs.variant == 'touch-desktop' && 'TOUCH-DESKTOP' || inputs.variant == 'touch-active' && 'TOUCH-ACTIVE' || inputs.variant == 'touch-l6-abi' && 'TOUCH-L6-ABI' || inputs.variant == 'touch-l6-trace' && 'TOUCH-L6-TRACE' || inputs.variant == 'touch-l6-probe' && 'TOUCH-L6-PROBE' || inputs.variant == 'touch-reset-probe' && 'TOUCH-RESET-PROBE' || inputs.variant == 'touch-pinmux-probe' && 'TOUCH-PINMUX-PROBE' || inputs.variant == 'touch-clock-probe' && 'TOUCH-CLOCK-PROBE' || inputs.variant == 'touch-probe' && 'TOUCH-PROBE' || format('SMP{0}', matrix.cpu_count) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cpu_count: ${{ fromJSON(inputs.variant == 'touch-smp8-qos' && '[8]' || inputs.variant == 'touch-smp4-qos' && '[4]' || inputs.variant == 'touch-smp2-qos' && '[2]' || startsWith(inputs.variant, 'touch-') && '[1]' || '[2,8]') }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      DRIVER_VARIANT: ${{ startsWith(inputs.variant, 'touch-smp') && format('touch-smp{0}', matrix.cpu_count) || startsWith(inputs.variant, 'touch-') && 'touch' || format('smp{0}', matrix.cpu_count) }}
      SOURCE_RUN: ${{ startsWith(inputs.variant, 'touch-') && inputs.touch_source_run || '39964860075' }}
      IMAGE_LABEL: ${{ startsWith(inputs.variant, 'touch-smp') && format('TOUCH-SMP{0}-QOS', matrix.cpu_count) || inputs.variant == 'touch-input-qos' && 'TOUCH-INPUT-QOS' || inputs.variant == 'touch-capture-wake' && 'TOUCH-CAPTURE-WAKE' || inputs.variant == 'touch-hid-replay' && 'TOUCH-HID-REPLAY' || inputs.variant == 'touch-capture' && 'TOUCH-CAPTURE' || inputs.variant == 'touch-desktop' && 'TOUCH-DESKTOP' || inputs.variant == 'touch-active' && 'TOUCH-ACTIVE' || inputs.variant == 'touch-l6-capture' && 'TOUCH-L6-CAPTURE' || inputs.variant == 'touch-l6-abi' && 'TOUCH-L6-ABI' || inputs.variant == 'touch-l6-trace' && 'TOUCH-L6-TRACE' || inputs.variant == 'touch-l6-probe' && 'TOUCH-L6-PROBE' || inputs.variant == 'touch-reset-probe' && 'TOUCH-RESET-PROBE' || inputs.variant == 'touch-pinmux-probe' && 'TOUCH-PINMUX-PROBE' || inputs.variant == 'touch-clock-probe' && 'TOUCH-CLOCK-PROBE' || inputs.variant == 'touch-probe' && 'TOUCH-PROBE' || format('SMP{0}', matrix.cpu_count) }}
      CLOCK_PREPARE: ${{ inputs.variant == 'touch-clock-probe' && '1' || '0' }}
      PINMUX_PREPARE: ${{ inputs.variant == 'touch-pinmux-probe' && '1' || '0' }}
      RESET_PREPARE: ${{ inputs.variant == 'touch-reset-probe' && '1' || '0' }}
      L6_PREPARE: ${{ (inputs.variant == 'touch-l6-probe' || inputs.variant == 'touch-l6-trace') && '1' || '0' }}
      L6_ABI: ${{ inputs.variant == 'touch-l6-abi' && '1' || '0' }}
      L6_CAPTURE: ${{ inputs.variant == 'touch-l6-capture' && '1' || '0' }}
      TOUCH_ACTIVE: ${{ (inputs.variant == 'touch-active' || inputs.variant == 'touch-desktop' || inputs.variant == 'touch-capture' || inputs.variant == 'touch-capture-wake' || inputs.variant == 'touch-input-qos' || startsWith(inputs.variant, 'touch-smp')) && '1' || '0' }}
      TOUCH_DESKTOP: ${{ inputs.variant == 'touch-desktop' && '1' || '0' }}
      TOUCH_CAPTURE: ${{ (inputs.variant == 'touch-capture' || inputs.variant == 'touch-capture-wake' || inputs.variant == 'touch-input-qos' || startsWith(inputs.variant, 'touch-smp')) && '1' || '0' }}
      TOUCH_HID_REPLAY: ${{ inputs.variant == 'touch-hid-replay' && '1' || '0' }}
      TOUCH_HOME_WAKE: ${{ (inputs.variant == 'touch-capture-wake' || inputs.variant == 'touch-input-qos' || startsWith(inputs.variant, 'touch-smp')) && '1' || '0' }}
      TOUCH_INPUT_QOS: ${{ (inputs.variant == 'touch-input-qos' || startsWith(inputs.variant, 'touch-smp')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install EFI and FAT tools
        timeout-minutes: 5
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 install -y --no-install-recommends clang lld llvm mtools dosfstools libtinfo6 qemu-system-arm 7zip
          if ! command -v 7z >/dev/null; then sudo ln -s "$(command -v 7zz)" /usr/local/bin/7z; fi
      - name: Test explicit experiment qualification and payload bindings
        run: |
          python3 -B -m unittest discover -s tests -p 'test_chiron_driver_phone.py' -v
          python3 -B -m unittest discover -s tests -p 'test_chiron_touch_reset.py' -v
          python3 -B -m unittest discover -s tests -p 'test_chiron_l6_capture.py' -v
          python3 -B -m unittest discover -s tests -p 'test_chiron_touch_hid.py' -v
      - name: Download the source build and unchanged boot inputs
        run: |
          case "$SOURCE_RUN" in *[!0-9]*|'') exit 2;; esac
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "chiron-driver-source-$DRIVER_VARIANT-$SOURCE_RUN" --dir dist/driver-source
          gh run download 39951169904 --repo "$GITHUB_REPOSITORY" \
            --name chiron-memory-entry-39951169904 --dir dist/chiron-entry
          gh run download 39951169904 --repo "$GITHUB_REPOSITORY" \
            --name chiron-memory-firmware-39951169904 --dir dist/chiron-memory-firmware
          gh run download 39770335838 --repo "$GITHUB_REPOSITORY" \
            --name chiron-source-trace-39770335838-1 --dir dist/chiron-boot-template
          gh run download 39922183783 --repo "$GITHUB_REPOSITORY" \
            --name chiron-hackios-39922183783 --dir dist/chiron-runtime
      - name: Build only the explicit synthetic producer and small diagnostic root
        if: inputs.variant == 'touch-hid-replay'
        run: |
          python3 ci/hackios/apply_chiron_touch_hid.py build \
            --baseline dist/chiron-runtime/phone/root.apfs \
            --work "$RUNNER_TEMP/chiron-hid-build" \
            --output "$GITHUB_WORKSPACE/dist/chiron-hid-root"
      - name: Repack only the HOME task for physical touch capture
        if: inputs.variant == 'touch-capture-wake'
        run: |
          python3 ci/hackios/apply_chiron_touch_hid.py wake \
            --baseline dist/chiron-runtime/phone/root.apfs \
            --work "$RUNNER_TEMP/chiron-home-wake" \
            --output "$GITHUB_WORKSPACE/dist/chiron-home-wake"
      - name: Rebuild only the input consumer with interactive QoS
        if: inputs.variant == 'touch-input-qos'
        run: |
          python3 ci/hackios/apply_chiron_touch_hid.py qos \
            --baseline dist/chiron-runtime/phone/root.apfs \
            --work "$RUNNER_TEMP/chiron-input-qos" \
            --output "$GITHUB_WORKSPACE/dist/chiron-home-wake"
      - name: Reuse the exact verified single-core QoS userland
        if: startsWith(inputs.variant, 'touch-smp')
        run: |
          gh release download chiron-touch-20261026 --repo "$GITHUB_REPOSITORY" \
            --pattern MIX2-EXPERIMENTAL-TOUCH-INPUT-QOS.img --pattern manifest.json \
            --dir dist/qos-milestone/driver-image
          python3 ci/hackios/apply_chiron_touch_hid.py reuse-qos \
            --artifact dist/qos-milestone \
            --output "$GITHUB_WORKSPACE/dist/chiron-home-wake"
      - name: Compile the phone loader and bind the fresh kernel payload
        run: |
          EXTRA_ARGS=()
          if [ "$CLOCK_PREPARE" = 1 ]; then EXTRA_ARGS+=(--clock-prepare); fi
          if [ "$PINMUX_PREPARE" = 1 ]; then EXTRA_ARGS+=(--pinmux-prepare); fi
          if [ "$RESET_PREPARE" = 1 ]; then EXTRA_ARGS+=(--reset-prepare); fi
          if [ "$L6_PREPARE" = 1 ]; then EXTRA_ARGS+=(--l6-prepare); fi
          if [ "$L6_ABI" = 1 ]; then EXTRA_ARGS+=(--l6-abi); fi
          if [ "$L6_CAPTURE" = 1 ]; then EXTRA_ARGS+=(--l6-capture); fi
          if [ "$TOUCH_ACTIVE" = 1 ]; then EXTRA_ARGS+=(--touch-active); fi
          if [ "$TOUCH_DESKTOP" = 1 ]; then EXTRA_ARGS+=(--touch-desktop); fi
          if [ "$TOUCH_CAPTURE" = 1 ]; then EXTRA_ARGS+=(--touch-capture); fi
          if [ "$TOUCH_HID_REPLAY" = 1 ]; then EXTRA_ARGS+=(--touch-hid-replay-root "$GITHUB_WORKSPACE/dist/chiron-hid-root"); fi
          if [ "$TOUCH_HOME_WAKE" = 1 ]; then EXTRA_ARGS+=(--touch-home-wake-root "$GITHUB_WORKSPACE/dist/chiron-home-wake"); fi
          if [ "$TOUCH_INPUT_QOS" = 1 ]; then EXTRA_ARGS+=(--touch-input-qos); fi
          python3 ci/hackios/driver_phone.py \
            --source-build dist/driver-source --source-run "$SOURCE_RUN" \
            --runtime dist/chiron-runtime --variant "$DRIVER_VARIANT" \
            --work "$RUNNER_TEMP/driver-phone-loader" --output "$GITHUB_WORKSPACE/dist/driver-phone" \
            "${EXTRA_ARGS[@]}"
      - name: Package an explicitly unqualified temporary boot image
        run: |
          python3 ci/hackios/package-chiron.py \
            --template dist/chiron-boot-template/CT-39770335838-1-775f3f2e4009.img \
            --phone dist/driver-phone --entry dist/chiron-entry/ChironHackios.efi \
            --qualification dist/driver-phone/driver-experiment.json \
            --firmware dist/chiron-memory-firmware/chiron-unixnu.fd \
            --memory-policy dist/chiron-memory-firmware/memory-policy.json \
            --source-experiment --title "EXPERIMENTAL $IMAGE_LABEL" \
            --image-name "MIX2-EXPERIMENTAL-$IMAGE_LABEL.img" \
            --output dist/driver-image
          cp tools/start_chiron_hackios.py dist/driver-image/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: MIX2-EXPERIMENTAL-${{ env.IMAGE_LABEL }}-${{ github.run_id }}
          path: |
            dist/driver-image/
            dist/driver-phone/driver-experiment.json
            dist/driver-phone/inputs.json
            dist/chiron-hid-root/hid-replay.json
            dist/chiron-home-wake/home-wake.json
          retention-days: 7
          compression-level: 1
