name: MIX2 parallel driver source builds

on:
  push:
    branches: ['codex/chiron-parallel-drivers']
    paths: ['.github/workflows/hackios-chiron-drivers.yml']
  workflow_dispatch:
    inputs:
      variants:
        description: Independent driver source builds
        type: choice
        required: true
        default: all
        options: [all, smp, touch, touch-smp2, touch-smp8]

permissions:
  contents: read

jobs:
  source-build:
    name: Source build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'push' && '["smp2","smp8"]' || inputs.variants == 'smp' && '["smp2","smp8"]' || inputs.variants == 'touch-smp8' && '["touch-smp8"]' || inputs.variants == 'touch-smp2' && '["touch-smp2"]' || inputs.variants == 'touch' && '["touch"]' || '["touch","smp2","smp8"]') }}
    env:
      PORT_WORK: ${{ github.workspace }}/.cache/chiron-drivers
      PORT_EVIDENCE: ${{ github.workspace }}/dist/chiron-drivers
      HACKIOS_CHIRON_VARIANT: ${{ matrix.variant }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install source build dependencies
        timeout-minutes: 5
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 install -y --no-install-recommends \
            build-essential clang lld llvm flex bison m4 perl autoconf automake \
            curl xz-utils uuid-dev libxml2-dev libssl-dev zlib1g-dev pkg-config \
            libtinfo6 7zip qemu-system-arm qemu-efi-aarch64 ipxe-qemu python3-pil
          if ! command -v 7z >/dev/null; then sudo ln -s "$(command -v 7zz)" /usr/local/bin/7z; fi
      - name: Test driver logic and experiment isolation
        run: python3 -B -m unittest discover -s tests -p 'test_chiron_*.py' -v
      - name: Prepare the fixed native chiron source
        run: python3 ci/hackios/chiron.py prepare --work "$PORT_WORK" --evidence "$PORT_EVIDENCE"
      - name: Apply the independent loader experiment
        run: |
          python3 ci/hackios/driver_variants.py loader \
            --source "$PORT_WORK/kernel" --evidence "$PORT_EVIDENCE"
      - name: Build a fresh experimental source kernel and loader
        run: bash ci/hackios/build-chiron-kernel.sh "$PORT_WORK" "$PORT_EVIDENCE"
      - name: Preserve build failure logs
        if: failure()
        run: |
          mkdir -p "$PORT_EVIDENCE"
          for log in "$PORT_WORK/kernel/xnu-deps/"*.log; do
            test -f "$log" || continue
            cp "$log" "$PORT_EVIDENCE/dependency-$(basename "$log")"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chiron-driver-source-${{ matrix.variant }}-${{ github.run_id }}
          path: dist/chiron-drivers/
          retention-days: 7
          compression-level: 1
