name: MIX2 delivered SMP kernel QEMU

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful touch-smp8 source build
        type: string
        required: true
      phone_run:
        description: Matching touch-smp8-qos phone image build
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_RUN: ${{ inputs.source_run }}
      PHONE_RUN: ${{ inputs.phone_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install QEMU and loader tools
        timeout-minutes: 5
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=1 install -y --no-install-recommends \
            qemu-system-arm qemu-efi-aarch64 ipxe-qemu clang lld llvm device-tree-compiler python3-pil
      - name: Check validation logic
        run: python3 -B -m unittest discover -s tests -p test_chiron_smp_qemu.py -v
      - name: Download the exact delivered binaries and existing system volume
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "chiron-driver-source-touch-smp8-$SOURCE_RUN" --dir dist/smp-source
          gh run download "$PHONE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "MIX2-EXPERIMENTAL-TOUCH-SMP8-QOS-$PHONE_RUN" --dir dist/smp-phone
      - name: Download the received system volume
        run: |
          for ATTEMPT in $(seq 1 35); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/40446750621/artifacts" \
              --jq '.artifacts[] | select(.name == "chiron-ios165-system-replay") | .id')
            if [ -n "$ID" ]; then
              gh run download 40446750621 --repo "$GITHUB_REPOSITORY" \
                --name chiron-ios165-system-replay --dir dist/smp-system
              exit 0
            fi
            sleep 15
          done
          echo "Original system artifact was not finalized in time" >&2
          exit 1
      - name: Run the same kernel and small root on eight CPUs in two clusters
        run: |
          python3 ci/hackios/recheck_chiron_smp.py \
            --source dist/smp-source --source-run "$SOURCE_RUN" \
            --phone dist/smp-phone/driver-image --system dist/smp-system/system.apfs \
            --work "$RUNNER_TEMP/chiron-smp-qemu" --evidence dist/smp-qemu
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chiron-smp-qemu-${{ github.run_id }}
          path: dist/smp-qemu/
          retention-days: 7
          compression-level: 1
